name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag version and main ancestry
        run: |
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          test "$GITHUB_REF_NAME" = "v$app_version"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test
        run: swift test

      - name: Test release package
        run: bash Tests/PackagingTests/ReleasePackageTests.sh

      - name: Validate Homebrew tap token
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]]; then
            echo "::error::Missing GitHub secret: HOMEBREW_TAP_GITHUB_TOKEN"
            exit 1
          fi

      - name: Build release package
        run: bash Scripts/build-release.sh dist

      - name: Prepare checksum and Homebrew Cask
        run: |
          (cd dist && shasum -a 256 GitHub-Account-Switcher.tar.gz > checksums.txt)
          checksum="$(awk '{print $1}' dist/checksums.txt)"
          version="${GITHUB_REF_NAME#v}"
          bash Scripts/render-homebrew-cask.sh "$version" "$checksum" > dist/github-account-switcher.rb

      - name: Publish release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/GitHub-Account-Switcher.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/GitHub-Account-Switcher.tar.gz dist/checksums.txt --generate-notes --title "GitHub Account Switcher $GITHUB_REF_NAME"
          fi

      - uses: actions/checkout@v6
        with:
          repository: mobilepur/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew tap
        run: |
          install -m 644 dist/github-account-switcher.rb homebrew-tap/Casks/github-account-switcher.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/github-account-switcher.rb
          if git -C homebrew-tap diff --cached --quiet; then
            exit 0
          fi
          git -C homebrew-tap commit -m "Brew cask update for github-account-switcher version $GITHUB_REF_NAME"
          git -C homebrew-tap push origin HEAD:main
